name: Allegory vertical slice

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/agentsociety2/agentsociety2/contrib/env/allegory_town.py"
      - "packages/agentsociety2/agentsociety2/backend/routers/allegory.py"
      - "packages/agentsociety2/agentsociety2/backend/app.py"
      - "packages/agentsociety2/tests/**/test_allegory*.py"
      - "examples/v2/allegory_micro_society/**"
      - "frontend/src/pages/Allegory*/**"
      - "frontend/src/main.tsx"
      - "frontend/src/Menu.tsx"
      - ".github/workflows/allegory.yml"
  push:
    branches: [main, develop]
    paths:
      - "packages/agentsociety2/agentsociety2/contrib/env/allegory_town.py"
      - "packages/agentsociety2/agentsociety2/backend/routers/allegory.py"
      - "packages/agentsociety2/tests/**/test_allegory*.py"
      - "examples/v2/allegory_micro_society/**"
      - "frontend/src/pages/Allegory*/**"
      - ".github/workflows/allegory.yml"

concurrency:
  group: allegory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Allegory backend and environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install AgentSociety 2 development dependencies
        working-directory: packages/agentsociety2
        run: uv sync --extra dev

      - name: Compile Allegory runners
        run: python -m compileall -q examples/v2/allegory_micro_society

      - name: Ruff
        working-directory: packages/agentsociety2
        run: |
          uv run ruff check \
            agentsociety2/contrib/env/allegory_town.py \
            agentsociety2/backend/routers/allegory.py \
            tests/contrib/env/test_allegory_town.py \
            tests/backend/test_allegory_observer.py

      - name: Unit tests
        working-directory: packages/agentsociety2
        run: |
          uv run pytest -v \
            tests/contrib/env/test_allegory_town.py \
            tests/backend/test_allegory_observer.py

  frontend:
    name: Allegory frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
